[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subash-ai"
version = "0.3.0"
description = "Subash AI — учебный фреймворк нейросетей на чистом NumPy: autograd, MLP и мини-GPT для кода и текста"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sunset.ai", email = "nikita.wcnu@gmail.com" }]
keywords = ["neural-networks", "autograd", "transformer", "numpy", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
corpus = ["beautifulsoup4>=4.12"]

[tool.setuptools]
packages = ["subash"]
